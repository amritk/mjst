name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      # Keeps the whole workspace pre-1.0. `major` on a 0.x package means
      # 1.0.0 to changesets, so six separate PRs each marking a breaking
      # codegen change as `major` — all correct in isolation — silently put
      # four packages at 1.0.0 in the release PR. Reads the changeset
      # frontmatter directly, so it needs no git history beyond this checkout.
      - name: Version line
        run: bun run versions:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # The build only type-checks what it emits (tsconfig.build.json drops the
      # tests); this checks every package against the stricter root tsconfig.
      # Left out of CI originally, which let `types:check` sit broken in three
      # packages for weeks with nothing to catch it.
      #
      # Runs *after* the build, not before: a package resolves its workspace
      # imports through the sibling's `exports`, whose `types` condition points
      # at `dist/*.d.ts`. Without those emitted, every cross-package import is
      # TS2307 and the implicit-any cascade behind it.
      - name: Type check
        run: bun run types:check

  # Loads every compiled module under plain Node, runs the CLI from dist/
  # end-to-end (generate → tsc → parse), and installs packed tarballs like an
  # npm consumer — catches build/pack-step corruption the src-aliased tests
  # can't see (v0.12.3 of generate-parsers shipped an unparseable regex that
  # way).
  #
  # Its own job, on a Node matrix, because it is the only thing that runs the
  # shipped artifacts the way a consumer does. Inside the `check` job it ran on
  # whatever Node ubuntu-latest happened to carry — 24 today — so the
  # `engines: node >=20` floor every package advertises was never exercised.
  # The floor is where a too-new syntax or API in dist/ actually breaks, and it
  # breaks in a consumer's install rather than in CI.
  dist:
    name: Dist artifacts (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the current LTS. Anything in between fails the
        # same way one of these two does.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Smoke and e2e test built artifacts
        run: bun run test:dist
