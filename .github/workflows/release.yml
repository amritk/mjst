name: Release

on:
  push:
    branches:
      - main
  # Manual fallback. When GitHub drops the push event for a merge — it dropped
  # the one for 4b4b383, which produced no Release *or* CI run — main is left
  # carrying an unreleased changeset with no run to re-run, since none was ever
  # created. Without this the only recovery is to wait for the next merge to
  # carry the release along. Firing it by hand does the same work: changesets
  # opens the version PR (or publishes, on a version PR's own merge) from
  # whatever is on main.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Diagnostic, for when a release 403s on some packages but not others. npm
  # matches an OIDC token against a package's trusted publisher by workflow
  # *filename*, so this only answers anything from inside this file — run from a
  # workflow of any other name it reports "package not found" for all twelve.
  # Hence a job here rather than a workflow of its own: dispatch this workflow
  # from any branch but main and it runs the probe alone. It publishes nothing.
  probe:
    name: Probe npm OIDC
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exchange an OIDC token for every publishable package
        run: node scripts/npm-oidc-probe.mjs

  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing (OIDC) needs npm >= 11.5.1, but the ceiling matters
      # as much as the floor. npm 12 wraps `npm info --json` output in an array
      # where every earlier npm returned a bare object, and changesets reads
      # `pkgInfo.versions || []` straight off that object — so under npm 12 the
      # `[]` fallback hits for every package and the "is this already on npm?"
      # pre-check concludes nothing has ever been published. `changeset publish`
      # then tries to republish the whole workspace, and each package whose
      # version did not change fails with "You cannot publish over the
      # previously published versions", turning an otherwise good release red
      # (0.9.0 shipped exactly that way). The array also has no `.error`, so
      # changesets logs no 404 or unknown-error warning to give the game away.
      # Unpin once changesets handles npm 12's output shape.
      - name: Pin npm to 11 for trusted publishing
        run: npm install -g npm@11

      # Don't use setup-node's `registry-url`: it writes an .npmrc carrying a
      # deprecated `always-auth` line (hence the "Unknown user config
      # always-auth" warnings) and a `//registry.npmjs.org/:_authToken=` line
      # fed by NODE_AUTH_TOKEN — which is empty here, since publishing goes
      # through trusted publishing (OIDC), not a token. That empty auth token
      # made changesets' "is this version already on npm?" pre-check read the
      # registry as an authenticated request and fail, so `changeset publish`
      # fell back to trying to republish every already-published package and the
      # run went red on "cannot publish over the previously published versions".
      # A clean registry-only .npmrc leaves those reads anonymous (public), so
      # the pre-check correctly skips packages already on npm; OIDC still
      # supplies auth at publish time.
      - name: Write a clean npmrc for trusted publishing
        run: echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Last line of defense before publish: load every compiled module under
      # plain Node, run the CLI from dist/ end-to-end, and install packed
      # tarballs like an npm consumer, so a build or pack step that corrupts
      # the output (as tsc-alias did to generate-parsers v0.12.3) can never
      # ship to npm.
      - name: Smoke and e2e test built artifacts
        run: bun run test:dist

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: bun run release:version
          publish: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # npm writes its debug log at silly level no matter what reaches stdout, so
      # it holds the whole publish exchange: the OIDC token exchange, the PUT, and
      # whatever the registry actually said. The job log gets none of that — a
      # failed publish prints npm's canned 403 text ("forbidden by your security
      # policy"), which is what it says when the registry sends no reason at all.
      # Keeping the log means the next failure explains itself instead of needing
      # a run reproduced to ask again.
      - name: Keep npm's debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: ~/.npm/_logs/
          if-no-files-found: ignore
