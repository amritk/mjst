# The pull request title becomes the squash-merge commit subject, which is what
# release notes and version bumps are read from, so it is checked like one: by
# the shared rule in amritk/workflows (nish's), pinned by commit.
name: PR title

on:
  pull_request:
    # `edited` matters as much as `opened`: a title is usually fixed, not the
    # pull request reopened, and without it the red check never clears.
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

jobs:
  check:
    name: conventional title
    runs-on: ubuntu-latest
    steps:
      - uses: amritk/workflows/actions/pr-title@9c76f1544b63cd7d3d40ff369c995fbb6eea8ecc # amritk/workflows#5, unreleased
