# Proposes updates to the actions pinned by commit in .github/workflows, and to
# the bun dependencies of the workspace. The cooldown waits until a release is
# 5 days old, so a bad or compromised release has time to be caught and pulled
# first. Each ecosystem's updates arrive as one grouped pull request, titled as
# a conventional commit (ci: / build(deps): ) so the PR-title check passes it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      bun:
        patterns: ["*"]
